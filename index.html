<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazaynova — المساعد الذكي</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <div class="logo-icon">L</div>
                    <span class="logo-text">Lazaynova</span>
                </div>
                <button class="close-sidebar" id="closeSidebar">&times;</button>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="بحث...">
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active"><span class="icon">💬</span> دردشة جديدة</a>
                <a href="#" class="nav-item"><span class="icon">🕒</span> المحادثات</a>
                <a href="#" class="nav-item"><span class="icon">📖</span> المكتبة</a>
                <a href="#" class="nav-item"><span class="icon">🖼️</span> الوسائط</a>
                <a href="#" class="nav-item"><span class="icon">📄</span> المستندات</a>
                <a href="#" class="nav-item"><span class="icon">📅</span> جدولة</a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <button class="menu-btn" id="menuBtn">☰</button>
                <div class="top-logo"><span class="sparkle">✦</span> Lazaynova</div>
            </header>
            <div class="chat-viewport" id="chatViewport">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="hero-logo-container">
                        <div class="hero-3d-logo">L</div>
                        <h1 class="hero-title">مرحباً بك في Lazaynova 👋</h1>
                        <p class="hero-subtitle">أنا مساعدك الذكي، جاهز لمساعدتك في أي شيء.</p>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer"></div>
            </div>
            <div class="input-area-wrapper">
                <div class="input-bar">
                    <button class="tool-trigger-btn" id="toolTriggerBtn">+</button>
                    <input type="text" id="userInput" placeholder="اسأل Lazaynova..." autocomplete="off">
                    <button class="send-btn" id="sendBtn">⬆</button>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
