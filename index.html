<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Lazaynova — منصة الوكلاء الذكية</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>Lazaynova</strong><small>AI Agent Platform</small></div></div>
      <button class="new-chat" id="new-chat">＋ محادثة جديدة</button>
      <p class="side-label">الوكلاء</p>
      <button class="agent-link active" data-prompt="ساعدني في التخطيط لمهمة معقدة">✦ <span>المنسّق الذكي</span></button>
      <button class="agent-link" data-prompt="ابحث بعمق عن: ">⌕ <span>وكيل البحث</span></button>
      <button class="agent-link" data-prompt="ساعدني في البرمجة: ">⌘ <span>وكيل البرمجة</span></button>
      <button class="agent-link" data-prompt="ساعدني في إعداد مستند: ">▤ <span>وكيل المستندات</span></button>
      <div class="sidebar-foot">نسخة أولية · MVP</div>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="status-dot"></span> النظام جاهز</div><span class="pill">واجهة تجريبية</span></header>
      <section class="welcome" id="welcome">
        <div class="hero-icon">✦</div>
        <p class="eyebrow">وكيلك الذكي، وفريقك كاملًا</p>
        <h1>ماذا تريد أن <span>تنجز اليوم؟</span></h1>
        <p class="subtitle">اكتب المهمة ودع Lazaynova يوجّهها إلى التخصص المناسب.</p>
        <div class="quick-grid">
          <button data-prompt="ضع خطة تنفيذ لمشروعي خطوة بخطوة">▦ <b>خطط لمشروع</b><small>قسّم المهمة إلى خطوات</small></button>
          <button data-prompt="ساعدني في كتابة كود منظم لـ ">⌘ <b>اكتب كودًا</b><small>برمجة ومراجعة وتصحيح</small></button>
          <button data-prompt="ابحث بعمق عن ">⌕ <b>ابحث بعمق</b><small>تحليل موضوع وأسئلة</small></button>
          <button data-prompt="لخّص وصغ هذا المستند: ">▤ <b>أنشئ مستندًا</b><small>تلخيص وصياغة محتوى</small></button>
        </div>
      </section>
      <section class="chat-area" id="chat-area" hidden><div id="messages" class="messages"></div></section>
      <form class="composer" id="chat-form">
        <textarea id="message" rows="1" placeholder="اكتب مهمتك هنا..." required></textarea>
        <button id="send" type="submit" aria-label="إرسال">↑</button>
        <div class="composer-foot"><span>لا تضع كلمات مرور أو مفاتيح سرية في المحادثة.</span><span>مدعوم بواجهة API قابلة للتهيئة</span></div>
      </form>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
