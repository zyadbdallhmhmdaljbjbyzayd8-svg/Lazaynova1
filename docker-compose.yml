services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lazaynova
      POSTGRES_USER: lazaynova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_dev_only_change_me}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
volumes:
  postgres_data:
  minio_data:
