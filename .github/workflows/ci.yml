name: Web and API CI
on:
  push:
    paths:
      - "backend/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - ".github/workflows/ci.yml"
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
